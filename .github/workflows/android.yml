name: Android APK Build (Goz Finance)

on:
  push:
    branches:
      - main
    paths:
      - 'twa-manifest.json'
      - '.github/workflows/android.yml'
      - 'manifest.json'
  workflow_dispatch: # Cho phép nhấn nút chạy thủ công trên GitHub Actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Pre-configure Bubblewrap Environment
        run: |
          # 1. Cấp quyền thực thi cho gradlew
          chmod +x ./gradlew || true

          # 2. Chấp nhận các điều khoản Android SDK licenses
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

          # 3. Cấu hình Bubblewrap sử dụng JDK 17 và Android SDK có sẵn trên GitHub Runner (không hỏi Interactive)
          bubblewrap updateConfig --jdkPath="$JAVA_HOME" --androidSdkPath="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          echo "=== Bubblewrap Config ==="
          cat "$HOME/.bubblewrap/config.json"

      - name: Build APK (Automatic)
        run: |
          printf "n\n" | bubblewrap build --skipPwaValidation
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || '123456' }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || '123456' }}
          CI: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Goz-Finance-APK
          path: ./*.apk
