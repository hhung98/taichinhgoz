name: Android APK Build (Goz Finance)

on:
  push:
    branches:
      - main
  workflow_dispatch: # Cho phép nhấn nút chạy thủ công trên GitHub Actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Pre-configure Bubblewrap Environment
        run: |
          # 1. Cấp quyền thực thi cho gradlew
          chmod +x ./gradlew || true

          # 2. Chấp nhận các điều khoản Android SDK licenses
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

          # 3. Tạo sẵn file ~/.bubblewrap/config.json để Bubblewrap KHÔNG chạy Interactive Wizard hỏi Y/n (nguyên nhân gây exit code 130)
          mkdir -p "$HOME/.bubblewrap"
          printf '{\n  "jdkPath": "%s",\n  "androidSdkPath": "%s"\n}\n' "$JAVA_HOME" "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" > "$HOME/.bubblewrap/config.json"
          
          echo "=== Bubblewrap Config ==="
          cat "$HOME/.bubblewrap/config.json"

          # 4. Kiểm tra sức khỏe môi trường build
          bubblewrap doctor

      - name: Build APK (Automatic)
        run: |
          bubblewrap build --skipPwaValidation
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || '123456' }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || '123456' }}
          CI: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Goz-Finance-APK
          path: ./*.apk
